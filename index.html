<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matt Leung</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0a] text-[#f5f0e8] font-sans antialiased">
  <main class="min-h-screen flex flex-col">
    <header class="bg-[#0a0a0a] border-b-2 md:border-b-4 border-black px-4 md:px-8 lg:px-16 py-4 md:py-6">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <a
          href="#home"
          class="font-bold tracking-tight text-lg md:text-xl text-[#f5f0e8] border-0 border-b-2 border-transparent focus:outline-none focus:border-[#8f1d1d] transition-colors duration-200"
          aria-label="Matt Leung 首页"
        >
          Matt Leung
        </a>
      </div>
    </header>

    <section
      id="home"
      class="flex-1 flex items-center bg-[#0a0a0a] border-b-2 md:border-b-4 border-black px-4 md:px-8 lg:px-16 py-16 md:py-24 lg:py-32"
    >
      <div class="max-w-6xl mx-auto w-full">
        <div class="bg-[#f5f0e8] text-black border-2 md:border-4 border-black p-6 md:p-8 lg:p-12 hover:bg-black hover:text-white transition-colors duration-200">
          <h1 class="font-bold tracking-tight text-4xl md:text-6xl lg:text-8xl leading-none">
            Matt<br class="hidden md:block" /> Leung
          </h1>
          <div class="w-16 md:w-24 h-2 md:h-3 bg-[#8f1d1d] mt-6 md:mt-8 border-2 border-black"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
